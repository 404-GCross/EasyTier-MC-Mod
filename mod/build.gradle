def minecraftVersion = "1.21.8"
def fabricApiVersion = "0.134.0+1.21.8"

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

    // Mixin (needed for client source set in split environment)
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // ModMenu (optional — only for compile-time)
    modCompileOnly "com.terraformersmc:modmenu:13.0.2"
}
